name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run lint checks
        id: lint
        run: ./gradlew lint --stacktrace
        continue-on-error: true

      - name: Print lint report (diagnostics)
        if: always()
        run: |
          shopt -s nullglob
          for f in app/build/reports/lint-results-*.xml app/build/reports/lint-results-*.txt; do
            echo "===== $f ====="
            cat "$f"
          done

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # فك تشفير مفتاح التوقيع الثابت من أسرار GitHub (لا يتوفر لطلبات PR من fork خارجي
      # لأسباب أمنية معتادة في GitHub Actions؛ في تلك الحالة يبقى الإصدار بلا توقيع كسابقًا)
      - name: Decode release keystore
        if: github.event_name != 'pull_request'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "لا يوجد سر RELEASE_KEYSTORE_BASE64 — سيُبنى إصدار بلا توقيع."
          fi

      - name: Build release APK (signed if keystore secret is available)
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore

      # نشر إصدار GitHub Release بعلامة ثابتة "latest" يحمل الـ APK الموقّع، فقط
      # عند الدفع الفعلي لـ main (وليس عند طلبات PR). التطبيق يتحقق من هذا الإصدار
      # عبر GitHub API لعرض زر "تحديث متوفر" داخل الإعدادات.
      # نستخرج رقم الإصدار المُعرَّف يدويًا في الكود (MainActivity.BUILD_TAG) لتضمينه
      # في اسم الإصدار المنشور، ليتمكن التطبيق من مقارنته عند "التحقق من التحديث"
      - name: Extract app version tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION=$(grep -oP 'BUILD_TAG = "\K[^"]+' app/src/main/java/com/example/m3uplayer/MainActivity.kt)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish GitHub Release (latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "الإصدار ${{ env.APP_VERSION }}"
          make_latest: true
          files: app/build/outputs/apk/release/*.apk
          body: |
            APP_VERSION=${{ env.APP_VERSION }}
            تحديث تلقائي من آخر تعديل ناجح على الفرع الرئيسي.
